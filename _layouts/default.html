<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ─────────────────────────────── */
    :root {
      --bg:              #f5f3ee;
      --surface:         #ffffff;
      --surface-alt:     #f9f8f5;
      --header-bg:       #0b1120;
      --footer-bg:       #0b1120;
      --text:            #1a2030;
      --text-2:          #4a5568;
      --text-3:          #8c9baf;
      --accent:          #0284c7;
      --teal:            #0891b2;
      --teal-light:      #e0f7fa;
      --score-hi:        #059669;
      --score-hi-bg:     #ecfdf5;
      --score-hi-border: #34d399;
      --score-md:        #d97706;
      --score-md-bg:     #fffbeb;
      --score-md-border: #fbbf24;
      --border:          #e2ddd4;
      --shadow:          0 1px 3px rgba(0,0,0,.07), 0 2px 10px rgba(0,0,0,.04);
      --shadow-hover:    0 6px 24px rgba(0,0,0,.11), 0 2px 6px rgba(0,0,0,.06);
      --r:               10px;
      --r-sm:            6px;
      --serif:           "Noto Serif SC", "Songti SC", "SimSun", "STSong", Georgia, serif;
      --sans:            "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono:            "JetBrains Mono", "Cascadia Code", "Fira Code", monospace;
    }

    /* ── Reset ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.75;
    }

    /* ── Container ─────────────────────────────── */
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── Header ────────────────────────────────── */
    .site-header {
      background: var(--header-bg);
      color: rgba(255,255,255,.92);
      position: sticky;
      top: 0;
      z-index: 200;
      border-bottom: 2px solid var(--teal);
    }
    .site-header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
    }
    .site-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }
    .site-brand-icon {
      width: 32px; height: 32px;
      background: var(--teal);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .site-brand-name {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .site-nav { display: flex; gap: 24px; }
    .site-nav a {
      color: rgba(255,255,255,.7);
      text-decoration: none;
      font-size: .85rem;
      letter-spacing: .3px;
      transition: color .15s;
    }
    .site-nav a:hover { color: #fff; }

    /* ── Main ──────────────────────────────────── */
    .site-main { padding: 36px 0 72px; }

    /* ── Markdown fallback styles ──────────────── */
    .site-main h1 {
      font-family: var(--serif);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 10px;
    }
    .site-main h2 { font-family: var(--serif); font-size: 1.2rem; margin: 1.4em 0 .5em; color: var(--text); }
    .site-main p { margin: .6em 0 .9em; color: var(--text-2); }
    .site-main a { color: var(--accent); }
    .site-main code {
      font-family: var(--mono);
      font-size: .82em;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* ── Index table ───────────────────────────── */
    .site-main table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow);
      margin: 20px 0;
      font-size: .9rem;
    }
    .site-main thead { background: var(--header-bg); color: rgba(255,255,255,.9); }
    .site-main th { padding: 12px 18px; text-align: left; font-weight: 600; font-size: .82rem; letter-spacing: .5px; text-transform: uppercase; }
    .site-main td { padding: 11px 18px; border-top: 1px solid var(--border); }
    .site-main tbody tr:hover td { background: var(--surface-alt); }
    .site-main td a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .site-main td a:hover { text-decoration: underline; }

    /* ── Report header card ────────────────────── */
    .report-header {
      background: var(--surface);
      border-radius: var(--r);
      padding: 22px 26px;
      margin-bottom: 28px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--teal);
    }
    .report-header h1 {
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0 0 14px;
      color: var(--text);
    }
    .report-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-pill {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: .8rem;
      color: var(--text-2);
    }
    .stat-pill strong { color: var(--text); }
    .kw-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .kw-tag {
      display: inline-block;
      background: var(--teal-light);
      color: #0e7490;
      border-radius: 4px;
      padding: 2px 9px;
      font-size: .78rem;
      font-weight: 500;
    }
    .report-meta {
      font-size: .78rem;
      color: var(--text-3);
      margin-top: 10px;
    }

    /* ── Paper card ────────────────────────────── */
    .paper-card {
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      gap: 0;
      overflow: hidden;
      transition: box-shadow .2s, transform .18s;
      animation: fadeUp .35s ease both;
    }
    .paper-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    .paper-card.high  { border-left: 4px solid var(--score-hi); }
    .paper-card.medium { border-left: 4px solid var(--score-md); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* stagger children */
    .paper-card:nth-child(1)  { animation-delay: .04s; }
    .paper-card:nth-child(2)  { animation-delay: .08s; }
    .paper-card:nth-child(3)  { animation-delay: .12s; }
    .paper-card:nth-child(4)  { animation-delay: .16s; }
    .paper-card:nth-child(5)  { animation-delay: .20s; }
    .paper-card:nth-child(n+6) { animation-delay: .24s; }

    .paper-body { padding: 18px 22px; flex: 1; min-width: 0; }

    /* rank + title row */
    .paper-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 9px;
    }
    .paper-rank {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--text-3);
      min-width: 22px;
      padding-top: 5px;
      flex-shrink: 0;
    }
    .paper-title-wrap { flex: 1; min-width: 0; }
    .paper-title {
      font-family: var(--serif);
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.45;
      margin: 0 0 5px;
    }
    .paper-title a {
      color: var(--text);
      text-decoration: none;
    }
    .paper-title a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* score badge */
    .score-badge {
      flex-shrink: 0;
      padding: 4px 11px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: .82rem;
      font-weight: 500;
      border: 1px solid transparent;
      margin-top: 2px;
    }
    .score-badge.high   { background: var(--score-hi-bg); color: var(--score-hi); border-color: var(--score-hi-border); }
    .score-badge.medium { background: var(--score-md-bg); color: var(--score-md); border-color: var(--score-md-border); }

    /* meta row */
    .paper-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      font-size: .79rem;
      color: var(--text-3);
      margin-bottom: 9px;
    }
    .meta-authors { color: var(--text-2); }
    .cat-tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: .7rem;
      background: #eef2f7;
      color: #4a5a7a;
      border-radius: var(--r-sm);
      padding: 1px 7px;
    }

    /* reason */
    .paper-reason {
      font-size: .84rem;
      color: var(--text-2);
      background: var(--surface-alt);
      border-left: 3px solid var(--border);
      padding: 7px 12px;
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      margin-bottom: 10px;
      font-style: italic;
    }
    .reason-label {
      font-style: normal;
      font-weight: 600;
      font-size: .74rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .4px;
      display: block;
      margin-bottom: 2px;
    }

    /* abstract toggle */
    .paper-abstract { margin-top: 6px; }
    .paper-abstract summary {
      cursor: pointer;
      list-style: none;
      font-size: .82rem;
      color: var(--accent);
      font-weight: 500;
      padding: 4px 0;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .paper-abstract summary::-webkit-details-marker { display: none; }
    .paper-abstract summary::before {
      content: "▶";
      font-size: .6rem;
      transition: transform .2s;
      display: inline-block;
    }
    .paper-abstract[open] summary::before { transform: rotate(90deg); }
    .paper-abstract summary:hover { text-decoration: underline; }

    .abstract-content { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .abstract-zh, .abstract-en {
      font-size: .85rem;
      line-height: 1.8;
      color: var(--text-2);
      padding: 10px 14px;
      border-radius: var(--r-sm);
    }
    .abstract-zh {
      background: #f0fdf9;
      border-left: 3px solid #34d399;
    }
    .abstract-en {
      background: var(--surface-alt);
      border-left: 3px solid var(--border);
    }
    .abstract-lang {
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-3);
      margin-bottom: 5px;
    }

    /* ── Empty state ───────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-3);
      font-size: .95rem;
    }

    /* ── Footer ────────────────────────────────── */
    .site-footer {
      background: var(--footer-bg);
      color: rgba(255,255,255,.45);
      text-align: center;
      padding: 26px 0;
      font-size: .8rem;
    }
    .site-footer a { color: rgba(255,255,255,.65); text-decoration: none; }
    .site-footer a:hover { color: #fff; }
    .site-footer p { margin: 0; }

    /* ── Responsive ────────────────────────────── */
    @media (max-width: 640px) {
      .site-brand-name { font-size: .95rem; }
      .paper-top { flex-direction: column; gap: 6px; }
      .score-badge { align-self: flex-start; }
      .report-header h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="{{ site.baseurl | default: '' }}/" class="site-brand">
      <div class="site-brand-icon">📄</div>
      <span class="site-brand-name">{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ site.baseurl | default: '' }}/">首页</a>
      <a href="https://arxiv.org" target="_blank" rel="noopener">arXiv ↗</a>
    </nav>
  </div>
</header>

<main class="site-main">
  <div class="wrap">
    {{ content }}
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>由 <strong>arxiv-robot</strong> 每日自动更新 &nbsp;·&nbsp; LLM 语义相关性评分 &nbsp;·&nbsp; <a href="https://arxiv.org" target="_blank">arXiv.org</a></p>
  </div>
</footer>

</body>
</html>
